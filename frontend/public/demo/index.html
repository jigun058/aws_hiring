<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CareerLens 시연 영상</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700;800&display=swap" rel="stylesheet">
  <!-- 제출 링크(/demo/)는 고정, 영상은 S3의 media/demo.mp4를 CloudFront /media/로 낸다. 바꾸기: deploy/demo-video.sh -->
  <style>
    :root { --ink: #0E2350; --brand: #12307A; --body: #1E2B45; --sub: #4A5872; --line: #DCE3EC; --soft: #F3F5F8; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #fff; color: var(--body); font: 18px/1.6 'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif; }
    header { border-bottom: 1px solid var(--line); padding: 18px 0; }
    header .wrap { padding: 0 16px; }
    .wrap { max-width: 1120px; margin: 0 auto; }
    .logo { font-weight: 800; font-size: 22px; color: var(--brand); text-decoration: none; }
    main { padding: 32px 16px 56px; }
    h1 { margin: 0 0 8px; font-size: 30px; font-weight: 800; color: var(--ink); }
    p.lead { margin: 0 0 24px; color: var(--sub); }
    .player { position: relative; aspect-ratio: 16 / 9; background: var(--soft); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
    video { width: 100%; height: 100%; display: block; background: #000; }
    .wait { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; text-align: center; padding: 16px; color: var(--sub); font-weight: 700; }
    .player.missing video { display: none; }
    .player.missing .wait { display: flex; }
    .go { display: inline-block; margin-top: 24px; padding: 14px 24px; border-radius: 10px; background: var(--brand); color: #fff; font-weight: 800; text-decoration: none; }
    .go:hover { background: #0C2461; }
    .go:focus-visible { outline: 3px solid #24619E; outline-offset: 3px; }
  </style>
</head>
<body>
  <header><div class="wrap"><a class="logo" href="/">CareerLens 커리어렌즈</a></div></header>
  <main class="wrap">
    <h1>시연 영상</h1>
    <p class="lead">흩어진 경험을 대화로 모아 경험 카드를 만들고, 맞는 직무·채용공고·국비 교육과정까지 이어 주는 과정을 처음부터 끝까지 보여 드립니다.</p>
    <div class="player" id="player">
      <video controls preload="metadata" playsinline src="/media/demo.mp4" onerror="this.parentNode.classList.add('missing')"></video>
      <div class="wait">시연 영상을 준비하고 있어요. 잠시 뒤 다시 들러 주세요.</div>
    </div>
    <a class="go" href="/">서비스 직접 써 보기 →</a>
  </main>
</body>
</html>
